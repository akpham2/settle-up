<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e7c66">
<title>Settle Up</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root{--bg:#f6f5f2;--card:#fff;--ink:#1c1b19;--muted:#6d6a64;--line:#e4e1da;--accent:#0e7c66;--accent-ink:#fff;--soft:#e7f3ef;--warn:#b4471b;--warn-soft:#fff4ec;--done:#9a968d}
  @media (prefers-color-scheme:dark){:root{--bg:#141412;--card:#1f1e1b;--ink:#f1efe9;--muted:#a29e95;--line:#34322d;--accent:#3fbf9f;--accent-ink:#0c1a16;--soft:#1d2f2a;--warn:#f08a5d;--warn-soft:#2b1d14;--done:#6e6a62}}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  a{color:var(--accent)}
  .wrap{max-width:560px;margin:0 auto;padding:14px 14px 90px}
  .top{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
  .top h1{font-size:21px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
  .back{font-size:15px;text-decoration:none;font-weight:600}
  .tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
  .tabs a{flex:1;text-align:center;text-decoration:none;color:var(--muted);padding:9px 6px;border-radius:9px;font-weight:600;font-size:14px}
  .tabs a.on{background:var(--accent);color:var(--accent-ink)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .card h2{font-size:16px;margin:0 0 8px}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input,select,textarea{width:100%;font:16px inherit;font-family:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  textarea{min-height:110px;resize:vertical}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:10px;font:600 14px inherit;font-family:inherit;cursor:pointer;text-decoration:none}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.small{padding:7px 10px;font-size:13px}
  .btn.ghost{background:transparent}
  .btn.danger{color:var(--warn)}
  .btn.block{width:100%}
  .btn:disabled{opacity:.5;cursor:default}
  .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .muted{color:var(--muted);font-size:13px}
  .row{display:flex;gap:8px;align-items:center}
  .row>.grow{flex:1;min-width:0}
  .list>.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
  .list>.item:first-child{border-top:0}
  .item .info{flex:1;min-width:0}
  .item .t{font-weight:600}
  .item .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{display:inline-block;font-size:11px;background:var(--soft);color:var(--accent);padding:2px 8px;border-radius:99px;font-weight:700;white-space:nowrap}
  .pill.warn{background:var(--warn-soft);color:var(--warn)}
  .pill.grey{background:var(--bg);color:var(--muted)}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:6px}
  .seg button{flex:1;border:0;background:var(--card);color:var(--muted);padding:9px 4px;font:600 13px inherit;font-family:inherit;cursor:pointer;border-left:1px solid var(--line)}
  .seg button:first-child{border-left:0}
  .seg button.on{background:var(--soft);color:var(--accent)}
  .pay{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
  .pay.paid{opacity:.6}
  .pay .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .pay .who{font-weight:700}
  .money{font-weight:800;font-size:19px;color:var(--accent);white-space:nowrap}
  .pay.paid .money{color:var(--done);text-decoration:line-through}
  .qrbox{display:flex;gap:14px;align-items:center;margin-top:10px}
  .qr{width:140px;height:182px;flex:none;background:#fff;border-radius:10px;padding:4px;cursor:zoom-in;border:1px solid var(--line);-webkit-touch-callout:default}
  .qr svg{width:100%;height:100%;display:block}
  .bank{font-size:14px;min-width:0}
  .bank b{display:block;font-size:15px}
  .bank code{font-size:15px;word-break:break-all}
  .warnbox{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px;font-size:13px;margin-top:10px}
  .infobox{background:var(--soft);border-radius:12px;padding:12px;font-size:14px;margin-bottom:12px}
  .mini{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
  .mini:first-child{border-top:0}
  .mini .grow{flex:1;min-width:0}
  .mini.paid .amt{text-decoration:line-through;color:var(--done)}
  .amt{font-weight:700;white-space:nowrap}
  .bal{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;border-top:1px dashed var(--line)}
  .bal:first-child{border-top:0}
  .pos{color:var(--accent);font-weight:700}.neg{color:var(--warn);font-weight:700}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:50;padding:20px}
  .overlay.on{display:flex}
  .overlay .big{background:#fff;padding:10px;border-radius:16px;width:min(86vw,420px);max-height:72vh;display:flex;align-items:center;justify-content:center}
  .overlay .big img{max-height:68vh}
  .overlay .big svg{width:100%;height:100%}
  .overlay .cap{color:#fff;text-align:center;margin-top:14px;font-size:15px}
  .overlay .cap b{font-size:22px;display:block}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:40}
  .modal.on{display:flex}
  .sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 14px 24px;max-height:92vh;overflow:auto}
  .sheet h2{margin:0 0 6px;font-size:17px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .empty{text-align:center;color:var(--muted);padding:16px 6px;font-size:14px}
  .hero{text-align:center;padding:28px 6px 10px}
  .hero h1{font-size:28px;margin:0 0 6px}
  .sec{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 2px 8px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Loading…</div></div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="overlay" id="overlay"><div class="big" id="bigQr"></div><div class="cap" id="bigCap"></div><div class="cap" style="color:#bbb;font-size:13px">Long-press the image to save it · tap outside to close</div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   Basics
   ========================================================= */
const BANKS=[["Techcombank","970407"],["Vietcombank","970436"],["VietinBank","970415"],["BIDV","970418"],["Agribank","970405"],["MB Bank","970422"],["ACB","970416"],["VPBank","970432"],["TPBank","970423"],["Sacombank","970403"],["VIB","970441"],["SHB","970443"],["HDBank","970437"],["SeABank","970440"],["OCB","970448"],["MSB","970426"],["Eximbank","970431"],["LPBank","970449"],["Nam A Bank","970428"],["ABBANK","970425"],["Bac A Bank","970409"],["BVBank (Viet Capital)","970454"],["Kienlongbank","970452"],["PVcomBank","970412"],["Saigonbank","970400"],["Shinhan Bank","970424"],["Woori Bank","970457"],["CAKE by VPBank","546034"],["Ubank by VPBank","546035"]];
const bankName=bin=>(BANKS.find(b=>b[1]===bin)||["Bank "+bin])[0];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const strip=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D");
const cleanNote=s=>strip(s).replace(/[^A-Za-z0-9 .,\-]/g," ").replace(/\s+/g," ").trim().slice(0,40);
const CURRENCIES={VND:{d:0,sym:"₫",name:"Vietnamese đồng"},AUD:{d:2,sym:"A$",name:"Australian dollar"},USD:{d:2,sym:"US$",name:"US dollar"},NZD:{d:2,sym:"NZ$",name:"New Zealand dollar"},EUR:{d:2,sym:"€",name:"Euro"},GBP:{d:2,sym:"£",name:"British pound"},SGD:{d:2,sym:"S$",name:"Singapore dollar"},CAD:{d:2,sym:"C$",name:"Canadian dollar"},HKD:{d:2,sym:"HK$",name:"Hong Kong dollar"},THB:{d:2,sym:"฿",name:"Thai baht"},JPY:{d:0,sym:"¥",name:"Japanese yen"},KRW:{d:0,sym:"₩",name:"Korean won"}};
const CODES=Object.keys(CURRENCIES);
const D=c=>(CURRENCIES[c]||CURRENCIES.VND).d;
function money(n,c){
  c=CURRENCIES[c]?c:"VND";n=Math.round(n||0);
  if(c==="VND")return n.toLocaleString("vi-VN")+" ₫";
  const d=D(c),s=(Math.abs(n)/10**d).toLocaleString("en-AU",{minimumFractionDigits:d,maximumFractionDigits:d});
  return (n<0?"-":"")+CURRENCIES[c].sym+s;
}
const vnd=n=>money(n,"VND");
const toMajor=(n,c)=>(Math.round(n)/10**D(c)).toFixed(D(c));
const fmtInput=(n,c)=>n?(D(c)?toMajor(n,c):Math.round(n).toLocaleString("vi-VN")):"";
const curOpts=(sel,extra=[])=>[...new Set([sel,...extra,"VND","AUD","USD","NZD",...CODES])].filter(c=>CURRENCIES[c]).map(c=>`<option value="${c}" ${c===sel?"selected":""}>${c} · ${esc(CURRENCIES[c].name)}</option>`).join("");
// Currency named in a bit of text ("US$450", "450 nzd", "A$80", "2.75tr"); null if none.
const CUR_RE=/\b(VND|AUD|USD|NZD|EUR|GBP|SGD|CAD|HKD|THB|JPY|KRW)\b|(US\$|USD\$|AU\$|A\$|NZ\$|S\$|C\$|HK\$|€|£|¥|₩|฿|₫|đ|vnđ)/i;
function detectCur(t){
  const m=String(t||"").match(CUR_RE);if(!m)return null;
  if(m[1])return m[1].toUpperCase();
  const s=m[2].toUpperCase();
  return {"US$":"USD","USD$":"USD","AU$":"AUD","A$":"AUD","NZ$":"NZD","S$":"SGD","C$":"CAD","HK$":"HKD","€":"EUR","£":"GBP","¥":"JPY","₩":"KRW","฿":"THB","₫":"VND","Đ":"VND","VNĐ":"VND"}[s]||null;
}
// "25.50", "1,234.56", "1.234,56", "450", "1.2k" -> minor units of currency c
function parseMoney(str,c){
  let t=String(str??"").replace(new RegExp(CUR_RE.source,"gi"),"").replace(/\$/g,"").replace(/\s/g,"").toLowerCase();
  if(!D(c))return parseAmount(t);
  let mul=1;const m=t.match(/^(.*?)(k|m)$/);if(m){t=m[1];mul=m[2]==="k"?1e3:1e6}
  if(!/^[\d.,]+$/.test(t))return 0;
  const ld=t.lastIndexOf("."),lc=t.lastIndexOf(","),seps=(t.match(/[.,]/g)||[]).length;
  let dec=Math.max(ld,lc);
  if(dec>=0&&!(ld>=0&&lc>=0)&&(seps>1||t.length-dec-1===3))dec=-1;
  const ip=(dec>=0?t.slice(0,dec):t).replace(/[.,]/g,""),fp=dec>=0?t.slice(dec+1):"";
  return Math.round(parseFloat((ip||"0")+"."+(fp||"0"))*mul*10**D(c))||0;
}
const fmtDate=t=>new Date(t).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2000)}
async function copy(text,ok){
  try{await navigator.clipboard.writeText(text);toast(ok||"Copied")}
  catch(e){openSheet(`<h2>Copy this</h2><p class="muted" style="margin-top:0">Select the text and copy it.</p><textarea readonly style="min-height:220px">${esc(text)}</textarea><div class="btns"><button class="btn" data-close>Done</button></div>`);setTimeout(()=>$("#sheet textarea").select(),50)}
}
function parseAmount(s){
  if(s==null)return 0;
  const t=String(s).toLowerCase().replace(/\s|₫|vnd|vnđ|đ/g,"");
  const m=t.match(/^(-?[\d.,]+)(k|ng|nghin|nghìn|tr|trieu|triệu|m)?$/);
  if(!m){const d=t.replace(/[^\d-]/g,"");return d?parseInt(d,10)||0:0}
  if(m[2]){const v=parseFloat(m[1].replace(",","."));return Math.round(v*(/^(k|ng)/.test(m[2])?1e3:1e6))}
  return parseInt(m[1].replace(/[.,]/g,""),10)||0;
}

/* ---------- VietQR (NAPAS / EMVCo) ---------- */
const tlv=(id,v)=>id+String(v.length).padStart(2,"0")+v;
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,"0")}
function vietqrPayload(bin,acc,amount,note){
  const mai=tlv("00","A000000727")+tlv("01",tlv("00",bin)+tlv("01",acc))+tlv("02","QRIBFTTA");
  let s=tlv("00","01")+tlv("01",amount?"12":"11")+tlv("38",mai)+tlv("53","704");
  if(amount)s+=tlv("54",String(amount));
  s+=tlv("58","VN");
  if(note)s+=tlv("62",tlv("08",note));
  s+="6304";return s+crc16(s);
}
function qrSvg(text){
  if(typeof qrcode!=="function")return '<div class="muted" style="font-size:11px;padding:6px">QR couldn\'t load. Use the bank details.</div>';
  const q=qrcode(0,"M");q.addData(text);q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true});
}
// Draws a QR plus caption lines as a PNG (shareable, long-press savable).
const QR_CACHE=new Map();
function qrCanvas(payload,cap){
  if(typeof qrcode!=="function")return null;
  const q=qrcode(0,"M");q.addData(payload);q.make();
  const n=q.getModuleCount(),sc=12,qm=4,qs=(n+qm*2)*sc,W=qs,H=qs+190;
  const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,W,H);
  x.fillStyle="#000";
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect((k+qm)*sc,(r+qm)*sc,sc,sc);
  const font='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif';
  x.textAlign="center";let y=qs+18;
  x.fillStyle=cap.color||"#0e7c66";x.font=`800 44px ${font}`;y+=40;x.fillText(cap.amount,W/2,y,W-40);
  x.fillStyle="#1c1b19";x.font=`700 28px ${font}`;y+=46;x.fillText(cap.title,W/2,y,W-40);
  x.fillStyle="#555";x.font=`500 25px ${font}`;y+=38;x.fillText(cap.sub,W/2,y,W-40);
  if(cap.note){x.font=`400 22px ${font}`;y+=34;x.fillText(cap.note,W/2,y,W-40)}
  return c;
}
function qrImage(payload,cap){
  const k=payload+"|"+JSON.stringify(cap);
  if(!QR_CACHE.has(k)){const c=qrCanvas(payload,cap);QR_CACHE.set(k,c?c.toDataURL("image/png"):null)}
  return QR_CACHE.get(k);
}
const vietqrCap=(t,amount,note)=>({amount:vnd(amount),title:t.holder||t.name,sub:`${bankName(t.bin)} · ${t.acc}`,note:note?`Nội dung: ${note}`:""});
function paypalLink(m,amt,c){
  if(!m||!m.paypal||m.paypal.includes("@"))return null;
  return `https://paypal.me/${encodeURIComponent(m.paypal)}/${toMajor(amt,c)}${c}`;
}
const paypalCap=(t,amt,c)=>({amount:money(amt,c),title:t.name,sub:`PayPal · paypal.me/${t.paypal}`,note:"Scan with your phone camera",color:"#003087"});
// image (data URL) for paying member t: VietQR for VND, PayPal link QR otherwise
function payImageUrl(t,amt,c,note){
  if(c==="VND")return qrImage(vietqrPayload(t.bin,t.acc,amt,note),vietqrCap(t,amt,note))||vietqrLink(t,amt,note);
  const link=paypalLink(t,amt,c);return link?qrImage(link,paypalCap(t,amt,c)):null;
}
function qrFor(t,amount,note,c="VND"){
  const src=payImageUrl(t,amount,c,note);
  if(!src)return '<div class="muted" style="font-size:12px;padding:8px">QR couldn\'t load. Use the link instead.</div>';
  return `<img src="${esc(src)}" alt="QR ${esc(money(amount,c))} to ${esc(t.holder||t.name)}" style="width:100%;height:100%;object-fit:contain;display:block">`;
}
async function shareQr(t,amount,note,fromName,c="VND"){
  const fname=`${c==="VND"?"VietQR":"PayPal"}-${strip(t.name).replace(/[^A-Za-z0-9]+/g,"-")}-${toMajor(amount,c)}${c}.png`;
  const text=`${fromName?fromName+" → ":""}${t.holder||t.name}: ${money(amount,c)}${c!=="VND"&&paypalLink(t,amount,c)?"\n"+paypalLink(t,amount,c):""}`;
  const u=payImageUrl(t,amount,c,note);
  if(!u||!u.startsWith("data:")){window.open(c==="VND"?vietqrLink(t,amount,note):paypalLink(t,amount,c),"_blank");return}
  const blob=await (await fetch(u)).blob();
  const file=new File([blob],fname,{type:"image/png"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:c==="VND"?"VietQR":"PayPal",text});return}
  }catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=u;a.download=fname;document.body.appendChild(a);a.click();a.remove();
  toast("QR image saved");
}
function vietqrLink(m,amount,note){
  const p=new URLSearchParams();if(amount)p.set("amount",amount);if(note)p.set("addInfo",note);if(m.holder)p.set("accountName",m.holder);
  return `https://img.vietqr.io/image/${m.bin}-${encodeURIComponent(m.acc)}-compact2.png?${p}`;
}
const hasBank=m=>!!(m&&m.bin&&m.acc);
const canReceive=(m,c)=>c==="VND"?hasBank(m):!!(m&&m.paypal);

/* ---------- settle-up maths ---------- */
// balances: {memberId: amount}, positive = should receive. Returns [{from,to,amt}]
function roundBalances(bal){
  const out={};let sum=0;
  for(const k in bal){const v=Math.round(bal[k]);if(v){out[k]=v;sum+=v}}
  if(sum){ // push rounding drift onto the biggest absolute balance
    const k=Object.keys(out).sort((a,b)=>Math.abs(out[b])-Math.abs(out[a]))[0];
    if(k){out[k]-=sum;if(!out[k])delete out[k]}
  }
  return out;
}
function settleDirect(bal){
  const cred=Object.entries(bal).filter(([,v])=>v>0).map(([id,v])=>({id,v}));
  const debt=Object.entries(bal).filter(([,v])=>v<0).map(([id,v])=>({id,v:-v,n:0}));
  const out=[];
  const pay=(d,c,a)=>{out.push({from:d.id,to:c.id,amt:a});d.v-=a;c.v-=a;d.n++};
  // 1) exact matches
  for(const c of cred)for(const d of debt)if(c.v>0&&d.v>0&&c.v===d.v)pay(d,c,c.v);
  // 2) smallest creditors first, each paid in full by one debtor (prefer someone who hasn't paid yet, then the tightest fit)
  for(let guard=0;guard<1000;guard++){
    const cs=cred.filter(c=>c.v>0).sort((a,b)=>a.v-b.v);
    const ds=debt.filter(d=>d.v>0);
    if(!cs.length||!ds.length)break;
    if(cs.length===1){for(const d of ds)pay(d,cs[0],Math.min(d.v,cs[0].v));continue} // everything left goes to the last creditor
    const c=cs[0];
    const fit=ds.filter(d=>d.v>=c.v).sort((a,b)=>(a.n-b.n)||(a.v-b.v))[0];
    if(fit){pay(fit,c,c.v);continue}
    const d=ds.sort((a,b)=>b.v-a.v)[0]; // nobody can cover c alone: biggest debtor gives all they owe
    pay(d,c,d.v);
  }
  return out;
}
function settleHub(bal,hub){
  const out=[];
  for(const [id,v] of Object.entries(bal)){
    if(id===hub||!v)continue;
    if(v<0)out.push({from:id,to:hub,amt:-v});else out.push({from:hub,to:id,amt:v});
  }
  return out.sort((a,b)=>(a.to===hub?0:1)-(b.to===hub?0:1)||b.amt-a.amt);
}

/* ---------- ledger maths ---------- */
const isLedger=ev=>Array.isArray(ev&&ev.expenses);
const newId=()=>Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>"abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789"[b%55]).join("");
// Split amt by shares into whole đồng; leftover đồng go to the largest fractions (stable order).
function shareSplit(amt,parts){
  const W=parts.reduce((s,p)=>s+(p.w||1),0),out={};if(!W)return out;
  let acc=0;const fr=[];
  parts.forEach((p,i)=>{const ex=amt*(p.w||1)/W,v=Math.floor(ex);out[p.id]=(out[p.id]||0)+v;acc+=v;fr.push({id:p.id,f:ex-v,i})});
  fr.sort((a,b)=>b.f-a.f||a.i-b.i);
  for(let r=amt-acc,i=0;r>0&&fr.length;r--,i=(i+1)%fr.length)out[fr[i].id]++;
  return out;
}
function owedOf(x){return x.kind==="exact"?Object.fromEntries(x.parts.map(p=>[p.id,p.amt])):shareSplit(x.amt,x.parts)}
function expenseNets(x){
  if(x.kind==="net")return {...x.nets};
  const owed=owedOf(x),n={};
  for(const k in owed)n[k]=(n[k]||0)-owed[k];
  n[x.payer]=(n[x.payer]||0)+x.amt;return n;
}
// ctx = a gathering (or draft) with .cur (settle currency) and .rates {CUR: settle units per 1 CUR}
const evCur=ctx=>(ctx&&ctx.cur)||"VND";
const xCur=(x,ctx)=>x.cur||evCur(ctx);
function rateOf(ctx,c){if(c===evCur(ctx))return 1;const r=ctx&&ctx.rates&&ctx.rates[c];return r>0?r:null}
function convert(n,c,ctx){const r=rateOf(ctx,c);return r==null?null:Math.round(n*r*10**(D(evCur(ctx))-D(c)))}
function convertNets(nets,c,ctx){
  if(c===evCur(ctx))return nets;
  const r=rateOf(ctx,c);if(r==null)return null;
  const f=r*10**(D(evCur(ctx))-D(c)),raw={};for(const k in nets)raw[k]=nets[k]*f;
  return roundBalances(raw);
}
const missingRates=(list,ctx)=>[...new Set(list.map(x=>xCur(x,ctx)).filter(c=>rateOf(ctx,c)==null))];
function sumNets(list,ctx){
  const b={};
  for(const x of list){const n=convertNets(expenseNets(x),xCur(x,ctx),ctx);if(!n)continue;for(const [k,v] of Object.entries(n))b[k]=(b[k]||0)+v}
  return b;
}
const RATES={};
async function fetchRates(base){if(!RATES[base])RATES[base]=await api("/api/rates?base="+base);return RATES[base]}
// Adds market rates for any currency in `curs` the ctx doesn't have yet. Returns true if it changed.
async function fillRates(ctx,curs){
  const need=[...new Set(curs)].filter(c=>c&&c!==evCur(ctx)&&rateOf(ctx,c)==null);
  if(!need.length)return false;
  const d=await fetchRates(evCur(ctx));
  ctx.rates={...(ctx.rates||{})};
  need.forEach(c=>{if(d.rates[c])ctx.rates[c]=+d.rates[c].toPrecision(6)});
  return true;
}
function cleanBal(b){const o={};for(const k in b){const v=Math.round(b[k]);if(v)o[k]=v}return o}
function remainingBalances(ev){
  const b=sumNets(ev.expenses||[],ev);
  for(const p of ev.payments)if(p.paid){b[p.from]=(b[p.from]||0)+p.amt;b[p.to]=(b[p.to]||0)-p.amt}
  return cleanBal(b);
}
const makePlan=(bal,mode,hub)=>mode==="hub"&&hub?settleHub(bal,hub):settleDirect(bal);
const planOf=ev=>makePlan(remainingBalances(ev),ev.mode,ev.hub);
const costTotal=(list,ctx)=>list.filter(x=>x.kind!=="net").reduce((s,x)=>s+(convert(x.amt,xCur(x,ctx),ctx)||0),0);
function splitLabel(x,nameOf){
  if(x.kind==="net")return "Imported balances";
  const who=nameOf(x.payer);
  if(x.kind==="exact")return `${who} paid · exact amounts, ${x.parts.length} ${x.parts.length>1?"people":"person"}`;
  const shares=x.parts.reduce((s,p)=>s+p.w,0);
  return `${who} paid · split ${x.parts.length} ways${shares!==x.parts.length?` (${shares} shares)`:""}`;
}
async function pushPlan(ev){apply(await api(`/api/g/${GID}/events/${ev.id}`,{method:"POST",body:{payments:planOf(ev)}}))}

/* ---------- add / edit one cost ---------- */
function expenseSheet(ev,orig){
  const people=eventPeople(ev);
  const mine=me()&&G.members.some(m=>m.id===me().id)?me().id:null;
  const lastCur=ls.get("su_lastcur_"+ev.id,null);
  const E=orig?JSON.parse(JSON.stringify(orig)):{id:newId(),kind:"split",cur:lastCur&&CURRENCIES[lastCur]?lastCur:evCur(ev),desc:"",amt:0,payer:mine||(people[0]||{}).id,parts:people.map(p=>({id:p.id,w:p.w}))};
  if(!E.cur)E.cur=evCur(ev);
  const usedCurs=[...new Set([evCur(ev),...ev.expenses.map(x=>xCur(x,ev))])];
  if(E.kind==="net"){
    const nets=Object.entries(E.nets).sort((a,b)=>b[1]-a[1]);
    openSheet(`<h2>${esc(E.desc)}</h2><p class="muted" style="margin-top:0">Imported balances. They can't be edited, only removed.</p>
      ${nets.map(([id,v])=>`<div class="bal"><span>${esc(nm(id))}</span><span class="${v>0?"pos":"neg"}">${v>0?"gets ":"owes "}${money(Math.abs(v),xCur(E,ev))}</span></div>`).join("")}
      <div class="btns"><button class="btn" data-close>Close</button><button class="btn ghost danger" id="xDel" style="margin-left:auto">Remove</button></div>`);
    $("#xDel").onclick=()=>deleteExpense(ev,E);return;
  }
  // everyone who could be part of this cost: event people + anyone already on it
  let cands=[...new Set([...people.map(p=>p.id),...E.parts.map(p=>p.id),E.payer].filter(id=>mem(id)))];
  const wOf=id=>(people.find(p=>p.id===id)||{w:1}).w;
  const render=()=>{
    const others=G.members.filter(m=>!cands.includes(m.id));
    const on=id=>E.parts.find(p=>p.id===id);
    openSheet(`<h2>${orig?"Edit cost":"Add a cost"}</h2>
      <label style="margin-top:0">What for?</label><input id="xDesc" value="${esc(E.desc)}" maxlength="80" placeholder="e.g. Steak, beer, taxi">
      <div class="row" style="gap:10px;align-items:flex-end"><div style="flex:0 0 96px"><label>Currency</label><select id="xCur">${curOpts(E.cur,usedCurs).replace(/ · [^<]+</g,"<")}</select></div><div class="grow"><label>Amount</label><input id="xAmt" inputmode="decimal" value="${fmtInput(E.amt,E.cur)}" placeholder="${D(E.cur)?"125.50":"2.75tr or 350k"}"></div></div>
      <div class="row" style="gap:10px"><div class="grow"><label>Paid by</label><select id="xPayer">${[...cands.map(mem),...others].filter(Boolean).map(m=>`<option value="${m.id}" ${m.id===E.payer?"selected":""}>${esc(m.name)}</option>`).join("")}</select></div></div>
      <div class="muted" id="xAmtHint" style="margin-top:4px"></div>
      <label>Split</label><div class="seg"><button type="button" data-k="split" class="${E.kind==="split"?"on":""}">Equally / by shares</button><button type="button" data-k="exact" class="${E.kind==="exact"?"on":""}">Exact amounts</button></div>
      <div id="xRows" style="margin-top:6px">${cands.map(id=>{const p=on(id);return E.kind==="split"
        ?`<div class="mini"><label class="row grow" style="margin:0;color:var(--ink);font-size:15px;gap:10px"><input type="checkbox" data-on="${id}" ${p?"checked":""} style="width:20px;height:20px;flex:none"> <span>${esc(nm(id))}</span></label><input data-w="${id}" type="number" inputmode="decimal" min="0.5" max="20" step="0.5" value="${p?p.w:wOf(id)}" style="width:62px;padding:6px" ${p?"":"disabled"} aria-label="shares"><span class="amt" data-sh="${id}" style="min-width:92px;text-align:right"></span></div>`
        :`<div class="mini"><div class="grow">${esc(nm(id))}</div><input data-ex="${id}" inputmode="decimal" value="${p&&p.amt?fmtInput(p.amt,E.cur):""}" placeholder="0" style="width:130px;padding:6px;text-align:right"></div>`}).join("")}</div>
      ${others.length?`<div class="row" style="margin-top:8px"><select id="xAddP" class="grow"><option value="">+ Someone else was in on this…</option>${others.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join("")}</select></div>`:""}
      <div class="muted" id="xFoot" style="margin-top:8px"></div>
      <div class="btns"><button class="btn primary" id="xSave">Save</button><button class="btn" data-close>Cancel</button>${orig?`<button class="btn ghost danger" id="xDel" style="margin-left:auto">Delete</button>`:""}</div>`);
    const readAmt=()=>{E.amt=parseMoney($("#xAmt").value,E.cur)};
    const M=n=>money(n,E.cur);
    const hints=()=>{
      let h=E.amt?M(E.amt):"";
      if(E.amt&&E.cur!==evCur(ev)){const r=rateOf(ev,E.cur);h+=r?` ≈ ${money(convert(E.amt,E.cur,ev),evCur(ev))} at 1 ${E.cur} = ${r} ${evCur(ev)}`:` · converted to ${evCur(ev)} at today's rate when saved`}
      $("#xAmtHint").textContent=h;
      if(E.kind==="split"){
        const sh=E.amt&&E.parts.length?shareSplit(E.amt,E.parts):{};
        document.querySelectorAll("[data-sh]").forEach(s=>s.textContent=sh[s.dataset.sh]!=null?M(sh[s.dataset.sh]):"");
        $("#xFoot").textContent=E.parts.length?`${E.parts.length} ${E.parts.length>1?"people":"person"} · ${E.parts.reduce((s,p)=>s+p.w,0)} shares`:"Tick at least one person";
      }else{
        const sum=E.parts.reduce((s,p)=>s+(p.amt||0),0),left=E.amt-sum;
        $("#xFoot").innerHTML=!E.amt?"Enter the total first":left===0?`<span class="pos">Adds up ✓</span>`:`<span class="neg">${left>0?M(left)+" left to assign":M(-left)+" too much"}</span>`;
      }
    };
    $("#xAmt").oninput=()=>{readAmt();hints()};
    $("#xCur").onchange=()=>{
      const old=E.cur,n=$("#xCur").value;E.cur=n;
      const conv=v=>Math.round(v*10**(D(n)-D(old)));
      E.amt=conv(E.amt);if(E.kind==="exact")E.parts=E.parts.map(p=>({...p,amt:conv(p.amt)}));
      E.desc=$("#xDesc").value;render();
    };
    $("#xDesc").oninput=()=>E.desc=$("#xDesc").value;
    $("#xPayer").onchange=()=>{E.payer=$("#xPayer").value;if(!cands.includes(E.payer)){cands.push(E.payer);render()}};
    document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{
      if(E.kind===b.dataset.k)return;
      E.kind=b.dataset.k;
      if(E.kind==="exact")E.parts=[];
      else E.parts=E.parts.filter(p=>p.amt).map(p=>({id:p.id,w:wOf(p.id)}));
      if(E.kind==="split"&&!E.parts.length)E.parts=cands.map(id=>({id,w:wOf(id)}));
      render();
    });
    document.querySelectorAll("[data-on]").forEach(c=>c.onchange=()=>{
      const id=c.dataset.on;
      if(c.checked){if(!E.parts.find(p=>p.id===id))E.parts.push({id,w:parseFloat($(`[data-w="${id}"]`).value)||1})}
      else E.parts=E.parts.filter(p=>p.id!==id);
      $(`[data-w="${id}"]`).disabled=!c.checked;hints();
    });
    document.querySelectorAll("[data-w]").forEach(i=>i.oninput=()=>{const p=E.parts.find(x=>x.id===i.dataset.w);const v=parseFloat(i.value);if(p&&v>0)p.w=Math.min(20,v);hints()});
    document.querySelectorAll("[data-ex]").forEach(i=>i.oninput=()=>{
      const id=i.dataset.ex,a=parseMoney(i.value,E.cur);
      E.parts=E.parts.filter(p=>p.id!==id);if(a>0)E.parts.push({id,amt:a});
      E.parts.sort((x,y)=>cands.indexOf(x.id)-cands.indexOf(y.id));hints();
    });
    const ap=$("#xAddP");if(ap)ap.onchange=()=>{if(!ap.value)return;cands.push(ap.value);if(E.kind==="split")E.parts.push({id:ap.value,w:1});render()};
    $("#xSave").onclick=async()=>{
      readAmt();E.desc=$("#xDesc").value.trim();ls.set("su_lastcur_"+ev.id,E.cur);
      if(!E.amt)return toast("Enter the amount");
      if(!E.parts.length)return toast(E.kind==="split"?"Tick who shares this":"Enter who owes what");
      if(E.kind==="exact"&&E.parts.reduce((s,p)=>s+p.amt,0)!==E.amt)return toast("The amounts don't add up to the total");
      if(!E.desc)E.desc="Cost";
      await saveExpenses(ev,[E]);
    };
    const del=$("#xDel");if(del)del.onclick=()=>deleteExpense(ev,E);
    hints();
  };
  render();
  if(!orig)setTimeout(()=>{const d=$("#xDesc");if(d)d.focus()},60);
}
async function saveExpenses(ev,list){
  const next={...ev,expenses:[...ev.expenses.filter(x=>!list.some(n=>n.id===x.id)),...list]};
  try{
    try{await fillRates(next,list.map(x=>xCur(x,next)))}catch(e){toast("Couldn't get exchange rates. Enter them under Currencies.")}
    apply(await api(`/api/g/${GID}/events/${ev.id}/expenses`,{method:"POST",body:{expenses:list,payments:planOf(next),rates:next.rates||{}}}));
    closeSheet();toast(list.length>1?`${list.length} costs added`:"Saved");viewEvent(ev.id);
  }catch(e){toast(e.message)}
}
async function deleteExpense(ev,x){
  try{
    await api(`/api/g/${GID}/events/${ev.id}/expenses/${x.id}`,{method:"DELETE"});
    await pushPlan({...ev,expenses:ev.expenses.filter(e=>e.id!==x.id)});
    closeSheet();toast("Cost removed");viewEvent(ev.id);
  }catch(e){toast(e.message)}
}

  bindWhoAmI(()=>viewEvent(eid));

    $("#bigShare").onclick=e=>{e.stopPropagation();shareQr(t,p.amt,ev.note||cleanNote(ev.name),nm(p.from),C)};

    const sc=$("#setCur");if(sc)sc.onchange=async()=>{

    const getMkt=async()=>{try{delete RATES[C];const e2={...ev,rates:{}};await fillRates(e2,foreign.length?foreign:missing);await saveEv({rates:{...(ev.rates||{}),...e2.rates}});toast("Updated to today's rates")}catch(e){toast("Couldn't get rates: "+e.message)}};
    const mr=$("#mktRates");if(mr)mr.onclick=getMkt;

  $("#shareEv").onclick=()=>copy(`${ev.name}: costs and who owes what. Open it, pick your name, and scan your QR:\n${location.origin+gpath("/e/"+ev.id)}`,"Link copied");
  $("#editEv").onclick=()=>{
    openSheet(`<h2>Edit gathering</h2><label>Name</label><input id="en" value="${esc(ev.name)}" maxlength="60"><label>Transfer note</label><input id="eno" value="${esc(ev.note||"")}" maxlength="40"><div class="btns"><button class="btn primary" id="eok">Save</button><button class="btn" data-close>Cancel</button></div>`);
    $("#eok").onclick=async()=>{try{apply(await api(`/api/g/${GID}/events/${eid}`,{method:"POST",body:{name:$("#en").value,note:cleanNote($("#eno").value)}}));closeSheet();viewEvent(eid)}catch(e){toast(e.message)}};

}
/* ---------- names and parsing ---------- */
function matchMember(name){
  const n=strip(name).toLowerCase().replace(/\s+/g," ").trim();
  return G.members.find(x=>strip(x.name).toLowerCase().replace(/\s+/g," ").trim()===n)||null;
}
function canonName(name,known){
  const clean=String(name||"").replace(/\s+/g," ").trim().replace(/^(you|me|tôi|toi|mình|minh)$/i,()=>(me()||{}).name||"Me");
  const n=strip(clean).toLowerCase();if(!n)return null;
  const pool=[...new Set([...G.members.map(m=>m.name),...known])];
  const hit=pool.find(x=>strip(x).toLowerCase()===n);if(hit)return hit;
  const firsts=pool.filter(x=>strip(x).toLowerCase().split(" ")[0]===n);
  if(firsts.length===1)return firsts[0];
  return clean;
}
function parseList(str,known){
  const out=new Map();
  str.split(/\s*,\s*|\s*;\s*|\s+(?:and|và|va|&)\s+/i).map(x=>x.trim()).filter(Boolean).forEach(x=>{
    const m=x.match(/^(.+?)\s*[x×*]\s*(\d+(?:[.,]\d+)?)$/i)||x.match(/^(.+?)\s*\((\d+(?:[.,]\d+)?)\)$/);
    const name=canonName(m?m[1]:x,known);if(!name)return;
    if(!known.includes(name))known.push(name);
    const w=m?parseFloat(m[2].replace(",",".")):1;if(w>0)out.set(name,(out.get(name)||0)+w);
  });
  return [...out].map(([name,w])=>({name,w}));
}
// Text -> costs keyed by NAME (ids are filled in later by resolveNames/mapExpense).
function parseCostsText(text,crowd,defCur="VND"){
  const CC="(?:VND|AUD|USD|NZD|EUR|GBP|SGD|CAD|HKD|THB|JPY|KRW)";
  const AMT="((?:"+CC+"\\s?|US\\$|AU\\$|A\\$|NZ\\$|S\\$|C\\$|HK\\$|\\$|€|£|¥|₩|฿)?\\d[\\d.,]*\\s*(?:k|tr|triệu|trieu|m|nghìn|nghin)?\\s*(?:₫|đ|vnđ|"+CC+")?)";
  const amtOf=t=>{const c=detectCur(t)||defCur;return {c,a:parseMoney(t,c)}};
  const reOwe=new RegExp("^(.+?) (?:owes?|nợ|no|->|→|=>) (.+?)\\s*[:\\-–]?\\s*(?:₫|đ|vnd)?\\s*"+AMT+"$","i");
  const rePaidBy=new RegExp("^(.*?)\\s*[:\\-–]?\\s*"+AMT+" (?:paid by|by|do|trả bởi|tra boi) (.+?)(?: (?:for|split|chia|cho) (.+))?$","i");
  const rePaid=new RegExp("^(.+?) (?:paid|trả|tra) "+AMT+"(?: (?:for|on|cho) (.+?))?(?: (?:split|chia) (.+))?$","i");
  const rePeople=/^(?:people|who|everyone|ai|mọi người|moi nguoi)\s*:\s*(.+)$/i;
  const lines=String(text||"").split(/\n+/).map(x=>x.replace(/\s+/g," ").trim()).filter(Boolean);
  const known=crowd.map(c=>c.name);
  let people=null;
  for(const l of lines){const m=l.match(rePeople);if(m)people=parseList(m[1],known)}
  const everyone=people&&people.length?people:crowd;
  const exps=[],bad=[],t0=Date.now();
  for(const l of lines){
    if(rePeople.test(l))continue;
    let m=l.match(reOwe);
    if(m){const {a,c}=amtOf(m[3]),f=canonName(m[1],known),t=canonName(m[2],known);
      if(a&&f&&t&&f!==t){exps.push({id:newId(),kind:"exact",cur:c,desc:`${f} owes ${t}`,amt:a,payer:t,parts:[{id:f,amt:a}],created:t0+exps.length});continue}}
    let payer=null,amt=null,list=null,desc="";
    if((m=l.match(rePaidBy))){desc=m[1];amt=m[2];payer=m[3];list=m[4]||null}
    else if((m=l.match(rePaid))){payer=m[1];amt=m[2];desc=m[3]||"";list=m[4]||null}
    const {a,c}=amt?amtOf(amt):{a:0,c:defCur};
    if(a&&payer){
      payer=canonName(payer,known);
      const parts=list?parseList(list,known):everyone;
      if(!parts.length){bad.push(l);continue}
      exps.push({id:newId(),kind:"split",cur:c,desc:(desc||"").replace(/[\s:\-–]+$/,"").trim()||"Cost",amt:a,payer,parts:parts.map(p=>({id:p.name,w:p.w})),created:t0+exps.length});
      continue;
    }
    bad.push(l);
  }
  return {exps,people,bad};
}
const namesIn=exps=>[...new Set(exps.flatMap(x=>x.kind==="net"?Object.keys(x.nets):[x.payer,...x.parts.map(p=>p.id)]))];
async function resolveNames(names){
  const map={},create=[];
  for(const n of names){const m=matchMember(n);if(m)map[n]=m.id;else if(!create.includes(n))create.push(n)}
  if(create.length){
    const d=await api(`/api/g/${GID}/members`,{method:"POST",body:{members:create.map(name=>({name}))}});
    apply(d);create.forEach((n,i)=>map[n]=d.members[i].id);
  }
  return map;
}
function mapExpense(x,ids){
  if(x.kind==="net")return {...x,nets:Object.fromEntries(Object.entries(x.nets).map(([k,v])=>[ids[k],v]))};
  return {...x,payer:ids[x.payer],parts:x.parts.map(p=>({...p,id:ids[p.id]}))};
}
/* ---------- new gathering ---------- */
let NEW=null;
function viewNew(){
  if(!NEW||NEW.gid!==GID)NEW={gid:GID,cur:ls.get("su_cur_"+GID,"VND"),rates:{},name:"",note:"",source:"blank",crowd:new Map(G.members.map(m=>[m.id,1])),typed:"",draft:null,mode:"direct",hub:null,warn:""};
  const N=NEW;
  if(N.source==="paste"&&N.typed.trim())readPaste();
  const srcBtn=(k,l)=>`<button type="button" data-src="${k}" class="${N.source===k?"on":""}">${l}</button>`;
  let src="";
  if(N.source==="blank")src=`<p class="muted" style="margin:0">Start empty and add costs during the evening. Anyone with the link can add them.</p>`;
  else if(N.source==="paste")src=`<p class="muted" style="margin-top:0">One cost per line. A <b>People:</b> line overrides "Who's here".</p>
      <textarea id="typed" style="min-height:160px" placeholder="Steak 2.75tr paid by Anh&#10;Pizza 764k paid by Hoa&#10;Beer 438k paid by Huy for Anh, Nolan x2, Huy&#10;Nolan paid 124k for fruit&#10;Chau owes Hoa 50k"></textarea>
      <div class="btns"><button type="button" class="btn small" id="readTyped">Read it</button></div>
      <details class="muted" style="margin-top:8px"><summary>What can I write?</summary><div style="margin-top:6px"><i>Steak 2.75tr paid by Anh</i> splits between everyone here.<br><i>Beer 438k paid by Huy for Anh, Nolan x2</i> splits between those people only.<br><i>Anh paid 500k for taxi</i> also works.<br><i>Chau owes Hoa 50k</i> adds a direct debt.<br><i>People: Anh x2, Hoa, Huy</i> sets who's in.<br>Amounts: 350k, 1.2tr, 350.000, 350,000₫.</div></details>`;
  let preview="";
  const d=N.draft;
  if(d&&d.exps.length&&N.source!=="blank"){
    const need=missingRates(d.exps,N);
    if(need.length&&!N.fetching){N.fetching=true;fillRates(N,need).catch(e=>{N.warn="Couldn't get exchange rates: "+e.message}).finally(()=>{N.fetching=false;if(NEW===N&&location.pathname.endsWith("/new"))viewNew()})}
    const bal=cleanBal(sumNets(d.exps,N)),names=Object.keys(bal),M=n=>money(n,N.cur);
    if(N.hub&&!names.includes(N.hub))N.hub=null;
    if(N.mode==="hub"&&!N.hub)N.hub=(me()&&names.includes(me().name)?me().name:names.sort((a,b)=>bal[b]-bal[a])[0]);
    const plan=makePlan(bal,N.mode,N.hub);
    const per={};plan.forEach(p=>per[p.from]=(per[p.from]||0)+1);
    const spent=costTotal(d.exps,N);
    preview=`<div class="card"><h2>${d.exps.length} cost${d.exps.length>1?"s":""}${spent?` · ${M(spent)}`:""}</h2>
      ${need.length?`<p class="muted" style="margin-top:0">Getting exchange rates for ${need.join(", ")}…</p>`:""}
      ${d.exps.slice(0,6).map(x=>`<div class="mini"><div class="grow">${esc(x.desc)}<div class="muted">${esc(splitLabel(x,n=>n))}</div></div><span class="amt">${x.kind==="net"?"":money(x.amt,xCur(x,N))}</span></div>`).join("")}
      ${d.exps.length>6?`<div class="muted" style="padding-top:6px">and ${d.exps.length-6} more. You can edit them all after creating.</div>`:""}</div>
      <div class="card"><h2>Balances</h2>${names.sort((a,b)=>bal[b]-bal[a]).map(n=>`<div class="bal"><span>${esc(n)}${matchMember(n)?"":' <span class="pill grey">new</span>'}</span><span class="${bal[n]>0?"pos":"neg"}">${bal[n]>0?"gets ":"owes "}${M(Math.abs(bal[n]))}</span></div>`).join("")||'<div class="empty">Everyone is square.</div>'}
        <label>How should people pay?</label><div class="seg"><button type="button" data-mode="direct" class="${N.mode==="direct"?"on":""}">Directly to each other</button><button type="button" data-mode="hub" class="${N.mode==="hub"?"on":""}">Through one person</button></div>
        ${N.mode==="hub"?`<select id="hub" style="margin-top:8px">${names.map(n=>`<option value="${esc(n)}" ${n===N.hub?"selected":""}>${esc(n)}</option>`).join("")}</select>`:""}
        ${plan.length?`<p class="muted">${plan.length} payment${plan.length>1?"s":""}; most anyone makes is ${Math.max(...Object.values(per))}.</p>`:""}</div>`;
  }
  const canCreate=N.source==="blank"?N.crowd.size>0:!!(d&&d.exps.length);
  $("#app").innerHTML=`
  ${header("New gathering",gpath(),"Cancel")}
  <div class="card"><label style="margin-top:0">Name</label><input id="nName" value="${esc(N.name)}" maxlength="60" placeholder="e.g. Steak night">
    <label>Settle up in</label><select id="nCur">${curOpts(N.cur)}</select>
    <p class="muted" style="margin:6px 0 0">${N.cur==="VND"?"Paid back by VietQR bank transfer.":"Paid back by PayPal. Costs in other currencies are converted to "+N.cur+"."}</p>
    ${N.cur==="VND"?`<label>Transfer note (shows in the bank app)</label><input id="nNote" value="${esc(N.note)}" maxlength="40" placeholder="Defaults to the name, without accents">`:""}</div>
  ${N.source==="blank"||N.source==="paste"?`<div class="card"><h2>Who's here?</h2><p class="muted" style="margin-top:0">Costs are shared between these people unless you say otherwise. Tap ×1 to make it ×2 for a couple.</p>${crowdHtml(N.crowd)}</div>`:""}
  <div class="card"><h2>Costs</h2><div class="seg" style="margin-bottom:12px">${srcBtn("blank","Add as you go")}${srcBtn("paste","Paste costs")}</div>${src}
    ${N.warn?`<div class="warnbox">${esc(N.warn)}</div>`:""}</div>
  ${preview}
  <button class="btn primary block" id="create" ${canCreate?"":"disabled"}>Create gathering</button>`;

  const keep=()=>{N.name=$("#nName").value;if($("#nNote"))N.note=$("#nNote").value};
  $("#nName").oninput=keep;if($("#nNote"))$("#nNote").oninput=keep;
  $("#nCur").onchange=()=>{keep();N.cur=$("#nCur").value;N.rates={};ls.set("su_cur_"+GID,N.cur);viewNew()};
  if($("#cwAll"))bindCrowd(N.crowd,()=>{keep();viewNew()});
  document.querySelectorAll("[data-src]").forEach(b=>b.onclick=()=>{keep();N.source=b.dataset.src;N.draft=null;N.warn="";viewNew()});
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{keep();N.mode=b.dataset.mode;viewNew()});
  const hub=$("#hub");if(hub)hub.onchange=()=>{keep();N.hub=hub.value;viewNew()};
  const tx=$("#typed");if(tx){tx.value=N.typed;tx.oninput=()=>N.typed=tx.value}
  const rt=$("#readTyped");if(rt)rt.onclick=()=>{keep();N.typed=$("#typed").value;readPaste();if(!N.draft||!N.draft.exps.length)N.warn=N.warn||"Paste at least one cost.";viewNew()};
  $("#create").onclick=()=>{keep();createGathering($("#create"))};
}
function readPaste(){
  const N=NEW;
  const crowd=[...N.crowd].map(([id,w])=>({name:nm(id),w}));
  const r=parseCostsText(N.typed,crowd,N.cur);
  N.draft={exps:r.exps,people:r.people};
  N.warn=r.bad.length?`Couldn't read: ${r.bad.slice(0,3).join(" · ")}${r.bad.length>3?` (+${r.bad.length-3} more)`:""}`:"";
  if(!r.people&&!N.crowd.size&&r.exps.some(x=>x.kind==="split"))N.warn=(N.warn?N.warn+" ":"")+"Tick who's here, or add a People: line.";
}
async function createGathering(btn){
  const N=NEW;
  if(!N.name.trim())return toast("Give the gathering a name");
  btn.disabled=true;
  try{
    let people=[],expenses=[],hub=null;
    if(N.source==="blank"){people=[...N.crowd].map(([id,w])=>({id,w}))}
    else{
      const d=N.draft;
      const names=[...new Set([...(d.people||[]).map(p=>p.name),...namesIn(d.exps)])];
      const ids=await resolveNames(names);
      expenses=d.exps.map(x=>mapExpense(x,ids));
      const pm=new Map();
      if(N.source==="paste"&&!d.people)[...N.crowd].forEach(([id,w])=>pm.set(id,w));
      (d.people||[]).forEach(p=>pm.set(ids[p.name],p.w));
      names.forEach(n=>{if(!pm.has(ids[n]))pm.set(ids[n],1)});
      people=[...pm].map(([id,w])=>({id,w}));
      if(N.mode==="hub"&&N.hub)hub=ids[N.hub]||null;
    }
    const mode=N.mode==="hub"&&hub?"hub":"direct";
    const ctx={cur:N.cur,rates:{...N.rates},expenses,payments:[],mode,hub};
    try{await fillRates(ctx,expenses.map(x=>xCur(x,ctx)))}catch(e){}
    const payments=planOf(ctx);
    const r=await api(`/api/g/${GID}/events`,{method:"POST",body:{name:N.name.trim(),cur:N.cur,rates:ctx.rates,note:N.cur==="VND"?cleanNote(N.note||N.name):"",mode,hub,people,expenses,payments,source:N.source}});
    apply(r);NEW=null;go(gpath("/e/"+r.event.id),true);
  }catch(e){toast(e.message);btn.disabled=false}
}

/* ---------- sheet & overlay ---------- */
function openSheet(html){$("#sheet").innerHTML=html;$("#modal").classList.add("on")}
function closeSheet(){$("#modal").classList.remove("on")}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeSheet()});
$("#overlay").onclick=e=>{if(e.target.tagName!=="IMG")$("#overlay").classList.remove("on")};

route();
