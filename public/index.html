<script>
/* =========================================================
   Basics
   ========================================================= */
const BANKS=[["Techcombank","970407"],["Vietcombank","970436"],["VietinBank","970415"],["BIDV","970418"],["Agribank","970405"],["MB Bank","970422"],["ACB","970416"],["VPBank","970432"],["TPBank","970423"],["Sacombank","970403"],["VIB","970441"],["SHB","970443"],["HDBank","970437"],["SeABank","970440"],["OCB","970448"],["MSB","970426"],["Eximbank","970431"],["LPBank","970449"],["Nam A Bank","970428"],["ABBANK","970425"],["Bac A Bank","970409"],["BVBank (Viet Capital)","970454"],["Kienlongbank","970452"],["PVcomBank","970412"],["Saigonbank","970400"],["Shinhan Bank","970424"],["Woori Bank","970457"],["CAKE by VPBank","546034"],["Ubank by VPBank","546035"]];
const bankName=bin=>(BANKS.find(b=>b[1]===bin)||["Bank "+bin])[0];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const strip=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D");
const cleanNote=s=>strip(s).replace(/[^A-Za-z0-9 .,\-]/g," ").replace(/\s+/g," ").trim().slice(0,40);
const vnd=n=>Math.round(n||0).toLocaleString("vi-VN")+" ₫";
const fmtDate=t=>new Date(t).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2000)}
async function copy(text,ok){
  try{await navigator.clipboard.writeText(text);toast(ok||"Copied")}
  catch(e){openSheet(`<h2>Copy this</h2><p class="muted" style="margin-top:0">Select the text and copy it.</p><textarea readonly style="min-height:220px">${esc(text)}</textarea><div class="btns"><button class="btn" data-close>Done</button></div>`);setTimeout(()=>$("#sheet textarea").select(),50)}
}
function parseAmount(s){
  if(s==null)return 0;
  const t=String(s).toLowerCase().replace(/\s|₫|vnd|vnđ|đ/g,"");
  const m=t.match(/^(-?[\d.,]+)(k|ng|nghin|nghìn|tr|trieu|triệu|m)?$/);
  if(!m){const d=t.replace(/[^\d-]/g,"");return d?parseInt(d,10)||0:0}
  if(m[2]){const v=parseFloat(m[1].replace(",","."));return Math.round(v*(/^(k|ng)/.test(m[2])?1e3:1e6))}
  return parseInt(m[1].replace(/[.,]/g,""),10)||0;
}

/* ---------- VietQR (NAPAS / EMVCo) ---------- */
const tlv=(id,v)=>id+String(v.length).padStart(2,"0")+v;
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,"0")}
function vietqrPayload(bin,acc,amount,note){
  const mai=tlv("00","A000000727")+tlv("01",tlv("00",bin)+tlv("01",acc))+tlv("02","QRIBFTTA");
  let s=tlv("00","01")+tlv("01",amount?"12":"11")+tlv("38",mai)+tlv("53","704");
  if(amount)s+=tlv("54",String(amount));
  s+=tlv("58","VN");
  if(note)s+=tlv("62",tlv("08",note));
  s+="6304";return s+crc16(s);
}
function qrSvg(text){
  if(typeof qrcode!=="function")return '<div class="muted" style="font-size:11px;padding:6px">QR couldn\'t load. Use the bank details.</div>';
  const q=qrcode(0,"M");q.addData(text);q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true});
}
function qrFor(t,amount,note){
  if(typeof qrcode==="function"){try{return qrSvg(vietqrPayload(t.bin,t.acc,amount,note))}catch(e){}}
  return `<img src="${esc(vietqrLink(t,amount,note).replace("-compact2.png","-qr_only.png"))}" alt="VietQR" style="width:100%;height:100%;object-fit:contain">`;
}
function vietqrLink(m,amount,note){
  const p=new URLSearchParams();if(amount)p.set("amount",amount);if(note)p.set("addInfo",note);if(m.holder)p.set("accountName",m.holder);
  return `https://img.vietqr.io/image/${m.bin}-${encodeURIComponent(m.acc)}-compact2.png?${p}`;
}
const hasBank=m=>m&&m.bin&&m.acc;

/* ---------- settle-up maths ---------- */
// balances: {memberId: amount}, positive = should receive. Returns [{from,to,amt}]
function roundBalances(bal){
  const out={};let sum=0;
  for(const k in bal){const v=Math.round(bal[k]);if(v){out[k]=v;sum+=v}}
  if(sum){ // push rounding drift onto the biggest absolute balance
    const k=Object.keys(out).sort((a,b)=>Math.abs(out[b])-Math.abs(out[a]))[0];
    if(k){out[k]-=sum;if(!out[k])delete out[k]}
  }
  return out;
}
function settleDirect(bal){
  const cred=Object.entries(bal).filter(([,v])=>v>0).map(([id,v])=>({id,v}));
  const debt=Object.entries(bal).filter(([,v])=>v<0).map(([id,v])=>({id,v:-v,n:0}));
  const out=[];
  const pay=(d,c,a)=>{out.push({from:d.id,to:c.id,amt:a});d.v-=a;c.v-=a;d.n++};
  // 1) exact matches
  for(const c of cred)for(const d of debt)if(c.v>0&&d.v>0&&c.v===d.v)pay(d,c,c.v);
  // 2) smallest creditors first, each paid in full by one debtor (prefer someone who hasn't paid yet, then the tightest fit)
  for(let guard=0;guard<1000;guard++){
    const cs=cred.filter(c=>c.v>0).sort((a,b)=>a.v-b.v);
    const ds=debt.filter(d=>d.v>0);
    if(!cs.length||!ds.length)break;
    if(cs.length===1){for(const d of ds)pay(d,cs[0],Math.min(d.v,cs[0].v));continue} // everything left goes to the last creditor
    const c=cs[0];
    const fit=ds.filter(d=>d.v>=c.v).sort((a,b)=>(a.n-b.n)||(a.v-b.v))[0];
    if(fit){pay(fit,c,c.v);continue}
    const d=ds.sort((a,b)=>b.v-a.v)[0]; // nobody can cover c alone: biggest debtor gives all they owe
    pay(d,c,d.v);
  }
  return out;
}
function settleHub(bal,hub){
  const out=[];
  for(const [id,v] of Object.entries(bal)){
    if(id===hub||!v)continue;
    if(v<0)out.push({from:id,to:hub,amt:-v});else out.push({from:hub,to:id,amt:v});
  }
  return out.sort((a,b)=>(a.to===hub?0:1)-(b.to===hub?0:1)||b.amt-a.amt);
}

/* ---------- CSV ---------- */
function parseCSV(text){
  const rows=[];let row=[],f="",q=false;
  text=text.replace(/^﻿/,"");
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;else if(ch===","){row.push(f);f=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}
    else f+=ch}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()));
}
// Splitwise group export -> {name: balance}
function splitwiseCsvBalances(text){
  const rows=parseCSV(text);const h=rows[0]||[];
  const ci=h.findIndex(x=>x.trim().toLowerCase()==="currency");
  if(ci<0||h.length<=ci+1)throw new Error("This doesn't look like a Splitwise export");
  const names=h.slice(ci+1).map(s=>s.trim());
  const total=rows.find(r=>(r[1]||"").trim().toLowerCase()==="total balance");
  const bal={};names.forEach(n=>bal[n]=0);
  const cur=new Set();
  if(total){names.forEach((n,i)=>bal[n]=parseFloat(total[ci+1+i])||0);cur.add((total[ci]||"").trim())}
  else rows.slice(1).forEach(r=>{cur.add((r[ci]||"").trim());names.forEach((n,i)=>bal[n]+=parseFloat(r[ci+1+i])||0)});
  return {bal,currencies:[...cur].filter(Boolean)};
}

/* =========================================================
   API
   ========================================================= */
async function api(path,opts={}){
  const res=await fetch(path,{method:opts.method||"GET",headers:{"content-type":"application/json",...(opts.pin?{"x-organizer-pin":opts.pin}:{})},body:opts.body?JSON.stringify(opts.body):undefined});
  let d={};try{d=await res.json()}catch(e){}
  if(!res.ok)throw new Error(d.error||("Error "+res.status));
  return d;
}
let G=null,GID=null,CONFIG={splitwise:false};
const me=()=>G&&G.members.find(m=>m.id===ls.get("su_me_"+GID,null));
const mem=id=>G&&G.members.find(m=>m.id===id);
const nm=id=>(mem(id)||{name:"?"}).name;
async function loadGroup(gid){
  G=await api(`/api/g/${gid}`);GID=gid;
  const rec=ls.get("su_groups",[]).filter(g=>g.id!==gid);rec.unshift({id:gid,name:G.name});ls.set("su_groups",rec.slice(0,10));
}
function apply(d){if(d&&d.members&&d.events)G=d;else if(d&&d.state)G=d.state}

/* =========================================================
   Router
   ========================================================= */
function go(path,replace){if(replace)history.replaceState(null,"",path);else history.pushState(null,"",path);route()}
window.addEventListener("popstate",route);
document.addEventListener("click",e=>{
  const a=e.target.closest("a[data-go]");if(a){e.preventDefault();go(a.getAttribute("href"))}
  if(e.target.closest("[data-close]"))closeSheet();
});
let poll=null;
async function route(){
  closeSheet();clearInterval(poll);
  const p=location.pathname.split("/").filter(Boolean);
  try{
    if(p[0]==="g"&&/^[A-Za-z0-9]{12}$/.test(p[1]||"")){
      if(GID!==p[1]||!G){$("#app").innerHTML='<div class="empty">Loading…</div>';await loadGroup(p[1])}
      const view=p[2]||"",arg=p[3];
      const render=()=>{
        if(view==="e"&&arg)return viewEvent(arg);
        if(view==="new")return viewNew();
        if(view==="people")return viewPeople();
        return viewGroup();
      };
      render();
      if(view!=="new")poll=setInterval(async()=>{if(document.hidden||$("#modal").classList.contains("on"))return;try{const before=JSON.stringify(G);await loadGroup(GID);if(JSON.stringify(G)!==before)render()}catch(e){}},15000);
    }else viewHome();
  }catch(e){$("#app").innerHTML=`<div class="card"><h2>Couldn't open this</h2><p class="muted">${esc(e.message)}</p><a class="btn" href="/" data-go>Home</a></div>`}
  window.scrollTo(0,0);
}
const gpath=s=>`/g/${GID}${s||""}`;
function header(title,backHref,backLabel){
  return `<div class="top">${backHref?`<a class="back" href="${backHref}" data-go>‹ ${esc(backLabel||"Back")}</a>`:""}<h1>${esc(title)}</h1></div>`;
}
function tabs(on){
  return `<nav class="tabs"><a href="${gpath()}" data-go class="${on==="g"?"on":""}">Gatherings</a><a href="${gpath("/people")}" data-go class="${on==="p"?"on":""}">People</a></nav>`;
}

/* =========================================================
   Views
   ========================================================= */
function viewHome(){
  const rec=ls.get("su_groups",[]);
  $("#app").innerHTML=`
  <div class="hero"><h1>Settle Up</h1><p class="muted" style="font-size:15px">Split the bill in Splitwise, then pay each other back with VietQR. Scan, confirm, done.</p></div>
  ${rec.length?`<div class="card"><h2>Your groups</h2><div class="list">${rec.map(g=>`<a class="item" href="/g/${esc(g.id)}" data-go><div class="info"><div class="t">${esc(g.name)}</div></div><span class="muted">›</span></a>`).join("")}</div></div>`:""}
  <div class="card"><h2>Start a group</h2>
    <p class="muted" style="margin:0">One group per circle of friends. Reuse it for every gathering.</p>
    <label>Group name</label><input id="gname" placeholder="e.g. Tay Ho Friday crew" maxlength="60">
    <div class="btns"><button class="btn primary" id="gcreate">Create group</button></div></div>`;
  $("#gcreate").onclick=async()=>{
    const b=$("#gcreate");b.disabled=true;
    try{const d=await api("/api/groups",{method:"POST",body:{name:$("#gname").value}});G=null;go(`/g/${d.id}/people`)}
    catch(e){toast(e.message);b.disabled=false}
  };
}

function whoAmICard(){
  const m=me();
  if(m)return `<div class="row muted" style="margin:-4px 2px 12px">You're <b style="color:var(--ink);margin:0 4px">${esc(m.name)}</b><a href="#" id="notme">not you?</a></div>`;
  if(!G.members.length)return "";
  return `<div class="infobox"><b>Who are you?</b> Pick yourself to see what you owe.
    <div class="row" style="margin-top:8px"><select id="pickme" class="grow"><option value="">Choose your name…</option>${G.members.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></div>
    <div class="muted" style="margin-top:6px">Not listed? <a href="#" id="addself">Add yourself</a>.</div></div>`;
}
function bindWhoAmI(rerender){
  const s=$("#pickme");if(s)s.onchange=()=>{ls.set("su_me_"+GID,s.value||null);rerender()};
  const n=$("#notme");if(n)n.onclick=e=>{e.preventDefault();ls.set("su_me_"+GID,null);rerender()};
  const a=$("#addself");if(a)a.onclick=e=>{e.preventDefault();memberSheet(null,true,rerender)};
}

function myStats(ev,mid){
  let owe=0,get=0;for(const p of ev.payments){if(p.paid)continue;if(p.from===mid)owe+=p.amt;if(p.to===mid)get+=p.amt}return {owe,get};
}
function viewGroup(){
  const m=me();
  const evs=G.events;
  $("#app").innerHTML=`
  ${header(G.name)}

const BANK_ALIASES={tcb:"970407",techcom:"970407",vcb:"970436",vietcom:"970436",ctg:"970415",vietin:"970415",bidv:"970418",agri:"970405",agribank:"970405",mb:"970422",mbbank:"970422",acb:"970416",vpb:"970432",vpbank:"970432",tpb:"970423",tpbank:"970423",stb:"970403",sacom:"970403",sacombank:"970403",vib:"970441",shb:"970443",hdb:"970437",hdbank:"970437",seab:"970440",seabank:"970440",ocb:"970448",msb:"970426",eib:"970431",exim:"970431",lpb:"970449",lpbank:"970449",cake:"546034",ubank:"546035",bvbank:"970454",vccb:"970454",namabank:"970428",nab:"970428",abb:"970425",abbank:"970425",bacabank:"970409",kienlong:"970452",klb:"970452",pvcom:"970412",shinhan:"970424",woori:"970457",saigonbank:"970400"};
function findBank(tok){
  const k=strip(tok).toLowerCase().replace(/[^a-z0-9]/g,"");if(!k)return null;
  if(/^\d{6}$/.test(k)&&BANKS.some(b=>b[1]===k))return k;
  if(BANK_ALIASES[k])return BANK_ALIASES[k];
  const hit=BANKS.find(([n])=>strip(n).toLowerCase().replace(/[^a-z0-9]/g,"")===k)||BANKS.find(([n])=>strip(n).toLowerCase().replace(/[^a-z0-9]/g,"").startsWith(k)&&k.length>=3);
  return hit?hit[1]:null;
}
function parsePeopleLines(text){
  return text.split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const parts=l.split(/\s*[,\t|;]\s*/).map(x=>x.trim()).filter(Boolean);
    const out={name:parts.shift()||""};
    for(const t of parts){
      const b=!out.bin&&findBank(t);
      if(b){out.bin=b;continue}
      if(!out.acc&&/^[0-9][0-9 .-]{4,}$/.test(t)){out.acc=t.replace(/\D/g,"");continue}
      if(!out.holder&&/[a-zA-Z\u00C0-\u1EF9]/.test(t)){out.holder=strip(t).toUpperCase();continue}
    }
    return out;
  }).filter(x=>x.name);
}

    try{apply(await api(`/api/g/${GID}/members`,{method:"POST",body:{members:body}}));closeSheet();toast(`${list.length} saved`);viewPeople()}catch(e){toast(e.message)}

function messageFor(ev,p){
  const f=mem(p.from),t=mem(p.to),note=ev.note||cleanNote(ev.name);
  const link=location.origin+gpath("/e/"+ev.id);
  if(!hasBank(t))return `Hi ${f.name}! For ${ev.name} you owe ${t.name} ${vnd(p.amt)}.\n${t.name} hasn't added bank details yet. They're listed here once added:\n${link}`;
  return [`Hi ${f.name}! Settling up for ${ev.name}: please send ${t.name} ${vnd(p.amt)}.`,``,
    `Scan this QR in any bank app (amount and note are already filled in):`,vietqrLink(t,p.amt,note),``,
    `Or transfer manually: ${bankName(t.bin)} · ${t.acc}${t.holder?" · "+t.holder:""}${note?"\nNote: "+note:""}`,``,
    `All payments for this gathering: ${link}`].join("\n");
}
const canRecord=(ev,p)=>!!(ev.swGroupId&&CONFIG.splitwise&&p.paid&&!p.swExpenseId&&(mem(p.from)||{}).swId&&(mem(p.to)||{}).swId);
function payCard(ev,p,role){
  const mine=role==="out",incoming=role==="in";
  const f=mem(p.from),t=mem(p.to),note=ev.note||cleanNote(ev.name);
  let body;
  if(!hasBank(t))body=`<div class="warnbox">${esc(t.name)} hasn't added bank details yet. Ask them to add them in <b>People</b>.</div>`;
  else body=`<div class="qrbox"><div class="qr" data-big="${p.id}">${qrFor(t,p.amt,note)}</div>
    <div class="bank"><b>${esc(t.holder||t.name)}</b>${esc(bankName(t.bin))}<br><code>${esc(t.acc)}</code>${note?`<div class="muted">Note: ${esc(note)}</div>`:""}</div></div>`;
  const sw=canRecord(ev,p);
  return `<div class="pay ${p.paid?"paid":""}"><div class="hd"><div class="who">${mine?"You → "+esc(t.name):incoming?esc(f.name)+" → you":esc(f.name)+" → "+esc(t.name)}</div><div class="money">${vnd(p.amt)}</div></div>${body}
    <div class="btns">${hasBank(t)?`<button class="btn small primary" data-big="${p.id}">Show QR</button>`:""}${hasBank(t)&&!mine&&!p.paid?`<button class="btn small" data-msg="${p.id}">Copy message</button>`:""}${hasBank(t)&&!incoming?`<button class="btn small" data-acc="${p.id}">Copy acct #</button>`:""}
    <button class="btn small" data-paid="${p.id}">${p.paid?"Undo paid":(mine?"I've paid ✓":incoming?"Got it ✓":"Mark paid ✓")}</button>
    ${sw?`<button class="btn small ghost" data-sw="${p.id}">Record in Splitwise</button>`:""}${p.swExpenseId?`<span class="pill" style="align-self:center">In Splitwise</span>`:""}</div></div>`;
}

  <div class="card"><h2>Where are the numbers?</h2><div class="seg" style="margin-bottom:12px">${srcBtn("sw","Splitwise")}${srcBtn("csv","CSV export")}${srcBtn("typed","Paste")}</div>${src}
    ${N.warn?`<div class="warnbox">${esc(N.warn)}</div>`:""}</div>
  ${preview}
  ${N.entries&&computePayments().length?`<button class="btn primary block" id="create">Create gathering</button>`:""}`;

  const keep=()=>{N.name=$("#nName").value;N.note=$("#nNote").value};
  $("#nName").oninput=keep;$("#nNote").oninput=keep;
  document.querySelectorAll("[data-src]").forEach(b=>b.onclick=()=>{keep();N.source=b.dataset.src;N.entries=null;N.warn="";N.info="";viewNew()});
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{keep();N.mode=b.dataset.mode;if(!N.hub||!N.entries.some(e=>e.key===N.hub))N.hub=(N.entries.find(e=>e.memberId&&me()&&e.memberId===me().id)||N.entries.slice().sort((a,b)=>b.balance-a.balance)[0]).key;viewNew()});
  const hub=$("#hub");if(hub)hub.onchange=()=>{keep();N.hub=hub.value;viewNew()};
  const swl=$("#swload");if(swl)swl.onclick=()=>{keep();pinFlow(async pin=>{swl.disabled=true;try{N.swGroups=(await api("/api/splitwise/groups",{pin})).groups;if(!N.swGroups.length)N.warn="No Splitwise groups found.";viewNew()}catch(e){if(/PIN/i.test(e.message))ls.set("su_pin","");N.warn=e.message;viewNew()}})};
  const swg=$("#swg");if(swg)swg.onchange=()=>{keep();if(!swg.value)return;pinFlow(async pin=>{
    try{const d=await api("/api/splitwise/groups/"+swg.value,{pin});N.swGroupId=d.id;if(!N.name)N.name=d.name;
      N.warn=d.otherCurrencies.length?`This group also has ${d.otherCurrencies.join(", ")} balances. Only VND is settled here.`:"";
      setBalances(d.members.map(x=>({name:x.name,swId:x.swId,balance:x.balance})));viewNew()}
    catch(e){N.warn=e.message;viewNew()}})};
  const csv=$("#csv");if(csv)csv.onchange=async()=>{keep();const f=csv.files[0];if(!f)return;
    try{const {bal,currencies}=splitwiseCsvBalances(await f.text());N.swGroupId=null;
      N.warn=currencies.some(c=>c!=="VND")?`This file has ${currencies.join(", ")} amounts; they're treated as VND.`:"";
      if(!N.name)N.name=f.name.replace(/\.csv$/i,"").replace(/_/g," ");
      setBalances(Object.entries(bal).map(([name,balance])=>({name,balance})));viewNew()}
    catch(e){N.warn=e.message;viewNew()}};
  const tx=$("#typed");if(tx){tx.value=N.typed;tx.oninput=()=>N.typed=tx.value}
  const rt=$("#readTyped");if(rt)rt.onclick=()=>{keep();N.typed=$("#typed").value;readTyped();viewNew()};
  const cr=$("#create");if(cr)cr.onclick=()=>{keep();createGathering(cr)};
}
function matchMember(name,swId){
  if(swId){const m=G.members.find(x=>x.swId===swId);if(m)return m}
  const n=strip(name).toLowerCase().trim();
  return G.members.find(x=>strip(x.name).toLowerCase().trim()===n)||null;
}
function setBalances(list){
  const N=NEW;N.kind="balances";
  const round=roundBalances(Object.fromEntries(list.map((x,i)=>["k"+i,x.balance])));
  N.entries=list.map((x,i)=>{const m=matchMember(x.name,x.swId);return {key:"k"+i,name:m?m.name:x.name,swId:x.swId||null,memberId:m?m.id:null,balance:round["k"+i]||0}});
  if(N.mode==="hub"&&!N.entries.some(e=>e.key===N.hub))N.mode="direct";
}
function canonName(name,known){
  const clean=String(name||"").replace(/\s+/g," ").trim().replace(/^(you|me|tôi|toi|mình|minh)$/i,()=>(me()||{}).name||"Me");
  const n=strip(clean).toLowerCase();if(!n)return null;
  const pool=[...new Set([...G.members.map(m=>m.name),...known])];
  const hit=pool.find(x=>strip(x).toLowerCase()===n);if(hit)return hit;
  const firsts=pool.filter(x=>strip(x).toLowerCase().split(" ")[0]===n);
  if(firsts.length===1)return firsts[0];
  return clean;
}
function parseList(str,known){
  return str.split(/\s*,\s*|\s*;\s*|\s+(?:and|và|va|&)\s+/i).map(x=>x.trim()).filter(Boolean).map(x=>{
    const m=x.match(/^(.+?)\s*[x×*]\s*(\d+(?:[.,]\d+)?)$/i)||x.match(/^(.+?)\s*\((\d+(?:[.,]\d+)?)\)$/);
    const name=canonName(m?m[1]:x,known);if(name&&!known.includes(name))known.push(name);
    return {name,w:m?parseFloat(m[2].replace(",",".")):1};
  }).filter(x=>x.name&&x.w>0);
}
function readTyped(){
  const N=NEW;N.warn="";N.info="";
  const AMT="(\\d[\\d.,]*\\s*(?:k|tr|triệu|trieu|m|nghìn|nghin)?)\\s*(?:₫|đ|vnd|vnđ)?";
  const reOwe=new RegExp("^(.+?) (?:owes?|nợ|no|->|→|=>) (.+?)\\s*[:\\-–]?\\s*(?:₫|đ|vnd)?\\s*"+AMT+"$","i");
  const rePaidBy=new RegExp("^(.*?)\\s*[:\\-–]?\\s*(?:₫|đ)?"+AMT+" (?:paid by|by|do|trả bởi|tra boi) (.+?)(?: (?:for|split|chia|cho) (.+))?$","i");
  const rePaid=new RegExp("^(.+?) (?:paid|trả|tra) (?:₫|đ)?"+AMT+"(?: (?:for|on|cho) (.+?))?(?: (?:split|chia) (.+))?$","i");
  const rePeople=/^(?:people|who|everyone|ai|mọi người|moi nguoi)\s*:\s*(.+)$/i;
  const lines=N.typed.split(/\n+/).map(x=>x.replace(/\s+/g," ").trim()).filter(Boolean);
  const known=[],bal={},add=(n,v)=>{bal[n]=(bal[n]||0)+v;if(!known.includes(n))known.push(n)};
  let crowd=null;
  for(const l of lines){const m=l.match(rePeople);if(m)crowd=parseList(m[1],known)}
  const costs=[],bad=[];let nPay=0;
  for(const l of lines){
    if(rePeople.test(l))continue;
    let m=l.match(reOwe);
    if(m){const a=parseAmount(m[3]),f=canonName(m[1],known),t=canonName(m[2],known);if(a&&f&&t&&f!==t){add(f,-a);add(t,a);nPay++;continue}}
    let payer=null,amt=null,list=null;
    if((m=l.match(rePaidBy))){payer=m[3];amt=m[2];list=m[4]||null}
    else if((m=l.match(rePaid))){payer=m[1];amt=m[2];list=m[4]||null}
    const a=amt&&parseAmount(amt);
    if(a&&payer){payer=canonName(payer,known);add(payer,0);costs.push({payer,a,list});continue}
    bad.push(l);
  }
  const everyone=crowd&&crowd.length?crowd:[...new Set([...G.members.map(x=>x.name),...known])].map(name=>({name,w:1}));
  let total=0;
  for(const c of costs){
    const parts=c.list?parseList(c.list,known):everyone;
    const W=parts.reduce((s,x)=>s+x.w,0);if(!W){bad.push(`${c.payer} ${c.a}`);continue}
    add(c.payer,c.a);total+=c.a;
    parts.forEach(x=>add(x.name,-c.a*x.w/W));
  }
  if(bad.length)N.warn=`Couldn't read: ${bad.slice(0,3).join(" · ")}${bad.length>3?` (+${bad.length-3} more)`:""}`;
  if(!costs.length&&!nPay){if(!bad.length)N.warn="Paste at least one cost.";N.entries=null;return}
  const shares=everyone.reduce((s,x)=>s+x.w,0);
  N.info=`Read ${costs.length} cost${costs.length===1?"":"s"}${costs.length?` (${vnd(total)})`:""}${nPay?` and ${nPay} direct debt${nPay>1?"s":""}`:""}.`+
    (costs.some(c=>!c.list)?` Shared costs are split between ${everyone.length} people${shares!==everyone.length?` (${shares} shares)`:""}${crowd?"":", meaning everyone in People. Add a People: line to change that"}.`:"");
  N.entries=null;
  setBalances(Object.entries(bal).map(([name,balance])=>({name,balance})));
}
function computePayments(){
  const N=NEW;if(!N.entries)return [];
  if(N.kind==="payments")return N.typedPays||[];
  const bal={};N.entries.forEach(e=>{if(e.balance)bal[e.key]=e.balance});
  return N.mode==="hub"&&N.hub?settleHub(bal,N.hub):settleDirect(bal);
}
async function createGathering(btn){
  const N=NEW;const pays=computePayments();if(!pays.length)return;
  if(!N.name.trim())return toast("Give the gathering a name");
  btn.disabled=true;
  try{
    const used=new Set(pays.flatMap(p=>[p.from,p.to]));
    const toCreate=N.entries.filter(e=>used.has(e.key)&&!e.memberId);
    const toLink=N.entries.filter(e=>e.memberId&&e.swId&&mem(e.memberId).swId!==e.swId);
    if(toCreate.length||toLink.length){
      const d=await api(`/api/g/${GID}/members`,{method:"POST",body:{members:[...toCreate.map(e=>({name:e.name,swId:e.swId||undefined})),...toLink.map(e=>({...mem(e.memberId),swId:e.swId}))]}});
      apply(d);toCreate.forEach((e,i)=>e.memberId=d.members[i].id);
    }
    const idOf=k=>N.entries.find(e=>e.key===k).memberId;
    const d=await api(`/api/g/${GID}/events`,{method:"POST",body:{name:N.name.trim(),note:cleanNote(N.note||N.name),mode:N.kind==="payments"?"typed":N.mode,source:N.source,swGroupId:N.swGroupId,payments:pays.map(p=>({from:idOf(p.from),to:idOf(p.to),amt:p.amt}))}});
    apply(d);NEW=null;go(gpath("/e/"+d.event.id),true);
  }catch(e){toast(e.message);btn.disabled=false}
}

/* ---------- sheet & overlay ---------- */
function openSheet(html){$("#sheet").innerHTML=html;$("#modal").classList.add("on")}
function closeSheet(){$("#modal").classList.remove("on")}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeSheet()});
$("#overlay").onclick=()=>$("#overlay").classList.remove("on");

api("/api/config").then(c=>CONFIG=c).catch(()=>{}).finally(route);
</script>
